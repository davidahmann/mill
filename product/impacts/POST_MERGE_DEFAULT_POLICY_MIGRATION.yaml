uncertainInvariantIds: []
surfaces:
  - id: defaulted-post-merge-policy-migration
    kind: operations
    change: >-
      Close only a historical delivery whose record lacks post-merge policy
      provenance and whose reviewed candidate proves that its full
      resulting-main list was an implicit configuration default; bind the
      configured subset once after authoritative merge readback without
      weakening pull-request checks.
  - id: delivery-policy-provenance
    kind: operations
    change: >-
      Record whether every new delivery plan received its resulting-main check
      list from explicit configuration or the implicit default, so no future
      record can use the historical compatibility path.
  - id: resulting-main-check-policy
    kind: operations
    change: >-
      Configure validate and codeql as the exact resulting-main checks while
      retaining validate, dependency-review, and codeql for every pull-request
      head.
  - id: patch-distribution
    kind: operations
    change: >-
      Advance the package version to 0.1.6 for a new immutable release candidate
      after the source and lifecycle remediation pass all native and release
      qualification gates.
