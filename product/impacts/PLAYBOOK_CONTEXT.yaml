authority: product/playbook-context.md
affected_invariants:
  - INV-HUMAN-AUTHORITY
  - INV-EXACT-EVIDENCE
  - INV-WORKER-LEAST-AUTHORITY
  - INV-DOWNSTREAM-INDEPENDENT
material_changes:
  - Optional indexed playbooks become digest-bound task context and manifest
    evidence.
  - Read-only metadata discovery precedes explicit task selection.
  - Playbook maintenance is a separately reviewed future change, never a
    current-run authority path.
  - A read-only run timeline projects redacted event lineage and blocks when it
    conflicts with durable lifecycle state.
verification:
  - positive and negative index, content, scope and stale-input tests
  - read-only CLI/timeline contract tests and public JSON schema checks
  - native check, packed package, audit, complete-diff review and PR CI
exceptions:
  - Native maintainer may update contracts, documentation and regression tests
    in the approved paths.
  - No release, MCP server, customer-system action, automatic update, telemetry
    export or support expansion is authorized.
