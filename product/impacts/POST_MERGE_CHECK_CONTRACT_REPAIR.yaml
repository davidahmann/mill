surfaces:
  - id: draft-delivery-policy
    kind: operations
    change: >-
      Bind exact pull-request checks separately from the subset that must run on
      the resulting default-branch commit, without weakening pre-merge evidence
      or human merge authority.
  - id: legacy-delivery-readback
    kind: operations
    change: >-
      Permit a bounded, persisted post-merge check-policy binding for an
      already-merged legacy delivery record only when its configured list is a
      subset of the original pre-merge requirements and all other bindings
      match.
  - id: verifier-timeout-cleanup-test
    kind: operations
    change: >-
      Give the existing daemon-owned OCI cleanup test enough bounded time for
      its image-inspection preflight under coverage-parallel host scheduling,
      while preserving the required client-timeout and forced-cleanup outcome.
