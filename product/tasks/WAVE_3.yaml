changelog_intent: add exact-candidate draft-PR delivery and truthful closure
versioning_impact: pre-alpha additive CLI, config, state, and result contracts
migration_impact:
  additive operational-state tables and run transitions with validated restore
  compatibility
docs_sync_refs:
  - README.md
  - product/PLAN.md
  - product/PRD.md
  - architecture/ARCHITECTURE.md
  - docs/development.md
