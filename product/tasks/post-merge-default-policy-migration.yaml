title: Migrate the proven defaulted post-merge policy and prepare 0.1.6
objective: >-
  Document the frozen maintainer-prepared migration that closes delivery
  01801a1b-58f9-480f-8cee-54ea2bbeabb2 only when its exact reviewed candidate
  proves that its full resulting-main check list was an implicit default, its
  record lacks policy provenance, the now-configured list is a nonempty subset
  of the original pull-request requirements, and authoritative merge readback
  has already established every other delivery identity. Persist the one-time
  binding and mark every new delivery as configured or implicit-default so this
  compatibility path cannot relax a future delivery. Configure validate and
  codeql as the resulting-main policy while retaining validate,
  dependency-review, and codeql for exact pull-request-head evidence. The
  prepared package identity is 0.1.6; do not publish, tag, create a GitHub
  Release, merge a pull request, or claim release qualification. The builder may
  only complete documentation and changelog records; it must not alter the
  prepared runtime source, schemas, tests, mill.yaml, package identity, task or
  impact authority, workflows, release evidence, or external-effect policy.
