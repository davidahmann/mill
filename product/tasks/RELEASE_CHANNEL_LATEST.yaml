  - test/release-workflow.test.ts
  - README.md
  - AGENTS.md
  - docs/release.md
  - docs/repository-settings.md
  - product/PLAN.md
  - product/release-v0.6.0.md
  - product/release-channel-latest.md
  - product/impacts/RELEASE_CHANNEL_LATEST.yaml
  - product/tasks/RELEASE_V0_6_0.yaml
  - product/tasks/RELEASE_CHANNEL_LATEST.yaml
acceptance_items:
  - RCL-01 protected publication explicitly names npm latest and reads it back
  - RCL-02 workflow policy rejects an alpha publication and missing latest proof
  - RCL-03 documentation records the v0.6.0 provider state and token boundary
  - RCL-04 native check and exact-candidate audit pass
validation_commands:
  - npm run check
  - node dist/cli.js --json --cwd . audit
constraints:
  - no npm bypass token, republish, channel mutation or environment-policy
    change
  - no new support claim until a fresh release exercises the workflow
closure:
