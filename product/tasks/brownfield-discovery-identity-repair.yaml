schemaVersion: "2"
id: mill-brownfield-discovery-identity-repair
title: Bind every discovery input to its captured committed source bytes
objective: >-
  Repair the repository-intelligence source-of-truth boundary so a clean-looking
  worktree cannot attribute modified physical bytes to HEAD, and preserve
  explicit uncertainty for nonliteral module loads and option-bearing test
  commands.
