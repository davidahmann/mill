    invariantIds: [INV-EXACT-EVIDENCE]
    scenarioIds: [SCN-BFD-003]
    coverage: new_behavior
    evidence: { mode: command, commandId: test:coverage }
  - id: ACC-BFD-004
    statement: >-
      Discovery is read-only and grants no task, delivery, merge, or release
      authority.
    invariantIds: [INV-EXACT-EVIDENCE, INV-HUMAN-AUTHORITY]
    scenarioIds: [SCN-BFD-004]
    coverage: both
    evidence: { mode: command, commandId: test:coverage }
  - id: ACC-BFD-005
    statement: >-
      Change results preserve direct and transitive importer leads while never
      proving unaffectedness from absence.
    invariantIds: [INV-EXACT-EVIDENCE]
    scenarioIds: [SCN-BFD-005]
    coverage: new_behavior
    evidence: { mode: command, commandId: test:coverage }
  - id: ACC-BFD-006
    statement: >-
      Static test inventory and declared selection remain distinct from unknown
