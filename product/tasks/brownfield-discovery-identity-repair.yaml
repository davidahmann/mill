    invariantIds: [INV-EXACT-EVIDENCE]
    scenarioIds: [SCN-BFD-001]
    coverage: new_behavior
    evidence: { mode: command, commandId: test:coverage }
  - id: ACC-BFD-002
    statement: >-
      A source commit/tree or extractor identity change makes prior repository
      evidence stale.
    invariantIds: [INV-EXACT-EVIDENCE]
    scenarioIds: [SCN-BFD-002]
    coverage: new_behavior
    evidence: { mode: command, commandId: test:coverage }
  - id: ACC-BFD-003
    statement: >-
      Discovery fails closed for unsafe source inputs and reports unresolved
