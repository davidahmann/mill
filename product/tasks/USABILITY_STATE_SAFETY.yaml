schemaVersion: "2"
task_id: mill-usability-state-safety
status: closed
owner: davidahmann
base_commit: 20623a29fc9b317fa17a9e82237d7ac5a681ff79
execution_mode: approved_native_maintainer
authority: product/usability-state-safety.md
impact_manifest: product/impacts/USABILITY_STATE_SAFETY.yaml
objective: >-
  Improve Mill's readable delivery path, durable local state migrations,
  redacted operating evidence, worker-boundary clarity and focused regression
  coverage without broadening authority or qualified support.
allowed_paths:
  - src/**
  - test/**
  - schemas/**
  - scripts/**
  - docs/**
  - product/**
  - architecture/**
  - README.md
  - AGENTS.md
  - .gitignore
  - CHANGELOG.md
  - package.json
  - package-lock.json
  - eslint.config.js
authority_preparation_paths:
  - product/**
  - docs/**
acceptance_items:
  - US-01 README and glossary present the existing approved-outcome path and
    public API accurately
  - US-02 numbered migrations preserve supported historical state and reject
    unsupported state
  - US-03 stats output is aggregate and redacted; a supported schema migration
    may run without changing run evidence
  - US-04 worker and GitHub credential guidance preserve current authority
    limits
  - US-05 native checks, audit, package inspection, required PR checks and
    GitHub review feedback pass or are resolved
validation_commands:
  - npm run check
  - node dist/cli.js --json --cwd . audit
required_reviews:
  - required PR checks and GitHub review feedback on the complete exact
    candidate diff
constraints:
  - one native-maintainer writer in a disposable worktree
  - preserve task, acceptance, verification, delivery and release authority
  - no GitHub App, credential, setting, release, publication,
    provider/customer-system action, telemetry export, MCP server, daemon,
    centralized service, automatic mutation, branch-protection change or
    support-matrix expansion
stop_conditions:
  - ambiguous authority, state-loss risk, secret disclosure or unavailable
    mandatory gate
  - recurring same-subsystem P0 or P1 finding
closure:
  status: completed
  owner: attended_maintainer_not_builder
  recorded_at: 2026-09-15
  merged_pull_request: https://github.com/davidahmann/mill/pull/48
  merge_commit: 99c987040f3d81e07b01b96e459d8103ab340147
  validation:
    - >-
      PR #48 validate, dependency-review, DCO, and CodeQL checks passed on the
      exact head.
    - >-
      Local format, lint, typecheck, documentation, workflow, schema, 356-test
      coverage, package-canary, and exact-candidate audit checks passed.
  disposition: >-
    The source increment is complete. Release identity and external publication
    remain under the separate v0.5.0 authority.
