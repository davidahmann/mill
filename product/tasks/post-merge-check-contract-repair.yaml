schemaVersion: "2"
id: mill-post-merge-check-contract-repair
title: Separate draft and resulting-main check contracts
objective: >-
  Document the frozen maintainer-prepared implementation that keeps
  `requiredChecks` as the complete exact pull-request-head gate and introduces
  optional `postMergeRequiredChecks` as a nonempty subset for resulting-main
  readback. The implementation persists and approval-binds both lists for new
  delivery records, and permits one explicit local binding for a legacy merged
  delivery only after authoritative merge readback, when every other delivery
  identity matches and every selected check was already required before merge.
  Do not weaken pull-request checks, human merge authority, candidate/tree
  identity, or fail-closed treatment of missing, pending, skipped, and failed
  checks. The frozen `mill.yaml` remains unchanged because it is a bound runtime
  control; a separately approved policy task may later opt Mill into `validate`
  and `codeql` for resulting-main readback while retaining all three
  pull-request checks. Update the README, developer and repository-settings
  guides, and a precise canary record explaining the PR-only dependency-review
  boundary and the observed blocked closure that motivated this repair. The
  builder must not change runtime source, generated schemas, tests, task or
  impact authority, configuration, workflow controls, version, or release
  evidence. Before committing its documentation-only output, it must format all
  changed Markdown with the repository Prettier configuration so `format:check`
  passes.
